
services:
  discord-bot:
    build:
      context: .
      target: runtime
    container_name: my-discord-bot
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  test:
    build:
      context: .
      target: test
    profiles:
      - test
    volumes:
      - ./data/ciphers.json:/app/data/ciphers.json:ro
      - ./data/ciphers:/app/data/ciphers:ro
    command: ["python", "-m", "pytest", "-q"]
